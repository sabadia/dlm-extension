name: Release

# A tag v1.2.3 builds the Chrome and Firefox packages, adds checksums, an SBOM and a provenance attestation,
# and publishes a GitHub release. Pull requests that change packaging run the same build as a dry run.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'wxt.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - name: Version
        id: v
        run: |
          pkg="$(node -p "require('./package.json').version")"
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$pkg" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Checks
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm check:licenses
      - name: Build and package both browsers
        run: |
          pnpm build:firefox
          pnpm lint:ext
          pnpm zip
          pnpm zip:firefox
          pnpm make:sbom
      - name: Sign the Firefox add-on (unlisted, through AMO)
        # Needs the repository secrets AMO_JWT_ISSUER and AMO_JWT_SECRET (an API key from addons.mozilla.org). A tag
        # without them fails: a release without the signed add-on would be one Firefox cannot install.
        if: steps.v.outputs.publish == 'true'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::error::the AMO_JWT_ISSUER and AMO_JWT_SECRET secrets are not set; the Firefox add-on cannot be signed"
            exit 1
          fi
          pnpm exec web-ext sign --source-dir .output/firefox-mv3 --channel unlisted \
            --artifacts-dir signed --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          ls -l signed
      - name: Checksums
        run: |
          mkdir -p release
          cp .output/*.zip release/
          if [ -d signed ]; then cp signed/*.xpi "release/dlm-extension-${{ steps.v.outputs.version }}-firefox.xpi"; fi
          cp dist/sbom.cdx.json "release/dlm-extension-${{ steps.v.outputs.version }}-sbom.cdx.json"
          cd release
          sha256sum * > SHA256SUMS
          ls -l
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release
          path: release/*

  publish:
    name: publish the release
    if: needs.package.outputs.publish == 'true'
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release
          path: release
      - name: Provenance attestation
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            release/*.zip
            release/*.xpi
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "${{ needs.package.outputs.version }}" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $pre \
            --repo "$GITHUB_REPOSITORY" \
            --title "DLM extension ${{ needs.package.outputs.version }}" \
            --generate-notes release/*
