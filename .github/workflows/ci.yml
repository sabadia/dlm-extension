name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check:api
      - run: pnpm typecheck
      - run: pnpm test:coverage

  build:
    name: build (Chrome and Firefox)
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - name: Build both browsers
        run: |
          pnpm build
          pnpm build:firefox
      - name: Lint the Firefox build
        # Errors fail the job. The two known warnings (Preact's internal innerHTML, Android minimum
        # version) are accepted.
        run: pnpm lint:ext
      - name: Package
        run: |
          pnpm zip
          pnpm zip:firefox
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: extension-zips
          path: .output/*.zip

  e2e:
    name: end-to-end (Chromium, real daemon)
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - name: Fetch the pinned DLM release and check its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(cat e2e/DLM_VERSION)"
          version="${tag#v}"
          dir="$RUNNER_TEMP/dlm"
          mkdir -p "$dir"
          gh release download "$tag" --repo sabadia/dlm-server --dir "$dir" \
            --pattern "dlm_${version}_checksums.txt" --pattern "dlm_${version}_linux_amd64.tar.gz"
          (cd "$dir" && grep "dlm_${version}_linux_amd64.tar.gz" "dlm_${version}_checksums.txt" | sha256sum --check -)
          tar -xzf "$dir/dlm_${version}_linux_amd64.tar.gz" -C "$dir" dlm
          echo "DLM=$dir/dlm" >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: e2e-traces
          path: test-results

  licences:
    name: licences and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - name: Dependency licences are allowed
        run: pnpm check:licenses
      - name: SBOM (CycloneDX)
        run: pnpm make:sbom
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sbom
          path: dist/sbom.cdx.json

  intent:
    name: intent record
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
      - name: intentline check
        run: uvx intentline==0.1.0 check --range "origin/${{ github.base_ref }}..HEAD"
